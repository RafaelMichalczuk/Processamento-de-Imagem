<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processador de Imagem Profissional</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>Processamento de Imagens</h1>
        <p>Aritmética, Lógica, Transformações e Filtros Espaciais</p>
    </header>

    <div class="main-layout">
        <aside class="controls">
            <div class="section-title">Fontes de Entrada</div>
            <div class="upload-section">
                <div class="drop-area" onclick="upload1.click()">
                    <p>Img A</p>
                    <input type="file" id="upload1" hidden>
                </div>
                <div class="drop-area" onclick="upload2.click()">
                    <p>Img B</p>
                    <input type="file" id="upload2" hidden>
                </div>
            </div>

            <div class="constante-card">
                <div class="slider-header">
                    <label>Constante (C)</label>
                    <span class="badge-value" id="valC">128</span>
                </div>
                <input type="range" id="rangeC" min="0" max="255" value="128">
            </div>

            <div class="menu-accordion">
                
                <details open>
                    <summary>Aritméticas</summary>
                    <div class="details-content">
                        <button onclick="executar('soma')">A + B</button>
                        <button onclick="executar('sub')">A - B</button>
                        <button onclick="executar('dif')">Diferença</button>
                        <button onclick="executar('media')">Média (Img)</button>
                        <button class="full-width" onclick="executar('blend')">Blending</button>
                    </div>
                </details>

                <details>
                    <summary>Operações C</summary>
                    <div class="details-content">
                        <button onclick="executar('addC')">Brilho (+C)</button>
                        <button onclick="executar('subC')">Brilho (-C)</button>
                        <button onclick="executar('multC')">Contraste (*C)</button>
                        <button onclick="executar('divC')">Contraste (/C)</button>
                    </div>
                </details>

                <details>
                    <summary>Transformações</summary>
                    <div class="details-content">
                        <button onclick="executar('gray')">Cinza</button>
                        <button onclick="executar('neg')">Negativo</button>
                        <button onclick="executar('flipH')">Espelhar H</button>
                        <button onclick="executar('flipV')">Espelhar V</button>
                        <button onclick="executar('threshold')">Limiar</button>
                        <button onclick="executar('histEq')">Equalizar</button>
                    </div>
                </details>

                <details>
                    <summary>Lógicas (Binárias)</summary>
                    <div class="details-content">
                        <button onclick="executar('and')">AND</button>
                        <button onclick="executar('or')">OR</button>
                        <button onclick="executar('xor')">XOR</button>
                        <button onclick="executar('not')">NOT (A)</button>
                    </div>
                </details>

                <details>
                    <summary>Filtros Passa-Baixa</summary>
                    <div class="details-content">
                        <button onclick="executar('fMax')">MAX</button>
                        <button onclick="executar('fMin')">MIN</button>
                        <button onclick="executar('fMean')">Média</button>
                        <button onclick="executar('fMediana')">MEDIANA</button>
                        <button onclick="executar('fOrdem')">ORDEM</button>
                        <button onclick="executar('fGauss')">GAUSSIANO</button>
                        <button class="full-width" onclick="executar('fSuavizacao')">SUAVIZAÇÃO CONSERVATIVA</button>
                    </div>
                </details>

                <details>
                    <summary>Filtros Passa-Alta</summary>
                    <div class="details-content">
                        <button onclick="executar('fPrewitt')">Prewitt</button>
                        <button onclick="executar('fSobel')">Sobel</button>
                        <button class="full-width" onclick="executar('fLaplace')">Laplaciano</button>
                    </div>
                </details>

                <details>
                    <summary>Morfologia</summary>
                    <div class="details-content">
                        <button onclick="executar('mDilatacao')">Dilatação</button>
                        <button onclick="executar('mErosao')">Erosão</button>
                        <button onclick="executar('mAbertura')">Abertura</button>
                        <button onclick="executar('mFechamento')">Fechamento</button>
                        <button class="full-width" onclick="executar('mContorno')">Contorno</button>
                    </div>
                </details>

            </div>

            <div class="action-buttons">
                <button class="discard" onclick="location.reload()">Limpar</button>
                <button class="save" onclick="salvarTudo()">Salvar</button>
            </div>
        </aside>

        <main class="visualization-area">
            <div class="canvas-panel">
                <div class="canvas-item">
                    <span>Entrada A</span>
                    <canvas id="c1"></canvas>
                    <div class="hist-container"><canvas id="h1"></canvas></div>
                </div>
                <div class="canvas-item">
                    <span>Entrada B</span>
                    <canvas id="c2"></canvas>
                    <div class="hist-container"><canvas id="hB"></canvas></div>
                </div>
                <div class="canvas-item result-item">
                    <span>Resultado</span>
                    <canvas id="res"></canvas>
                    <div class="hist-container"><canvas id="hRes"></canvas></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
